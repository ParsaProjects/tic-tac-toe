<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
        <h1>Library</h1>
    </header>

    <button id="toggle-btn">Add Book</button>
    
    <dialog id="dialog">
        <form method="dialog" id="form">
            <p><label>Add your names
                Player One:<input type="text" name="player-one" id="name" placeholder="John Pork" required>
                player Two:<input type="text" name="player-two" id="author" placeholder="Tim Cheese" required>
            </label></p>
        </form>
        <menu>
            <button id="continue">Continue</button>
        </menu>
    </dialog>


    <script src="script.js"></script>
  </body>
</html>
