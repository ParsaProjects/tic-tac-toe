<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div id="gameContainer">
        <h1>Tic Tac Toe</h1>
        <dialog id="dialog">
            <form method="dialog" id="form">
                <p><label>Enter Player Name's:
                    <div id="formContainer">
                        Player One "X":<input type="text" name="playerOne" id="playerOne" placeholder="John Pork" required>
                        Player Two "O":<input type="text" name="playerTwo" id="playerTwo" placeholder="Tim Cheese" required>
                    </div>
                </label></p>
            </form>
            <menu>
                <button id="confirm">Confirm</button>
            </menu>
        </dialog>
        <div id="cellContainer">
            <div cellIndex="0" class="cell"></div>
            <div cellIndex="1" class="cell"></div>
            <div cellIndex="2" class="cell"></div>
            <div cellIndex="3" class="cell"></div>
            <div cellIndex="4" class="cell"></div>
            <div cellIndex="5" class="cell"></div>
            <div cellIndex="6" class="cell"></div>
            <div cellIndex="7" class="cell"></div>
            <div cellIndex="8" class="cell"></div>
        </div>
        <h2 id="statusText"></h2>
        <button id="restartBtn">Restart</button>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
